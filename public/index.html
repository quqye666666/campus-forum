<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昆山市张浦高级中学 - 校园论坛</title>
<link rel="icon" type="image/png" href="/img/icon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="authPage" class="auth-page">
  <div class="auth-card">
    <div class="auth-icon-wrap"><img src="/img/icon.png" alt="" class="auth-icon"></div>
    <h1>昆山市张浦高级中学</h1>
    <p class="subtitle">校园生活分享平台</p>
    <div class="auth-tabs">
      <button id="loginTab" class="active" onclick="switchAuthTab('login')">登录</button>
      <button id="registerTab" onclick="switchAuthTab('register')">注册</button>
    </div>
    <form id="loginForm" onsubmit="return handleLogin(event)">
      <div class="form-group"><label>用户名</label><input type="text" id="loginUsername" placeholder="请输入用户名" required></div>
      <div class="form-group"><label>密码</label><input type="password" id="loginPassword" placeholder="请输入密码" required></div>
      <p id="loginError" class="error-msg"></p>
      <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
    <form id="registerForm" style="display:none" onsubmit="return handleRegister(event)">
      <div class="form-group"><label>用户名</label><input type="text" id="regUsername" placeholder="请输入用户名" required></div>
      <div class="form-group"><label>昵称</label><input type="text" id="regNickname" placeholder="你的昵称" required></div>
      <div class="form-group"><label>密码</label><input type="password" id="regPassword" placeholder="至少6位密码" required minlength="6"></div>
      <p id="regError" class="error-msg"></p>
      <button type="submit" class="btn btn-primary btn-block">注 册</button>
    </form>
  </div>
</div>

<div id="appLayout" style="display:none">

  <div id="toast" class="toast"></div>

  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightboxImg" src="" alt="">
  </div>

  <header class="topbar">
    <div class="logo" onclick="showMainPage()"><img src="/img/icon.png" alt="" class="logo-icon"><span class="logo-text">张浦高级中学</span></div>
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="搜索帖子..." onkeydown="if(event.key==='Enter')searchPosts()">
    </div>
    <div class="user-info">
      <span class="online-count" id="onlineCount" title="在线人数">🟢 0</span>
      <button class="btn btn-outline btn-sm" style="margin-right:12px" onclick="showChat()">💬 私信</button>
      <div class="user-avatar" id="topAvatar" onclick="goMyProfile(event)" title="个人主页"></div>
      <div class="user-name-area" onclick="toggleUserDropdown(event)">
        <span id="topNickname"></span>
        <span class="dropdown-arrow" id="dropdownArrow">&#9660;</span>
      </div>
      <div class="user-dropdown" id="userDropdown">
        <a href="#" onclick="event.preventDefault();goMyProfile(event)">个人主页</a>
        <a href="#" onclick="event.preventDefault();showChat()">私信</a>
        <a href="#" onclick="event.preventDefault();showMainPage()">首页</a>
        <div class="divider"></div>
        <a href="#" onclick="event.preventDefault();handleLogout()" class="logout">退出登录</a>
      </div>
    </div>
  </header>

  <div id="mainPage">
    <div class="main-content">
      <aside class="sidebar">
        <nav class="sidebar-nav">
          <div class="nav-header">帖子分区</div>
          <div id="sectionNav">
            <div class="nav-item active" data-section="0" onclick="selectSection(0)"><span class="icon">&#127760;</span> 全部动态</div>
          </div>
          <div class="nav-divider"></div>
          <div class="nav-item nav-poll" data-section="-1" onclick="selectSection(-1)"><span class="icon">&#128202;</span> 投票区</div>
        </nav>
      </aside>
      <main class="feed" id="feed">
        <div class="post-composer" id="postComposer">
          <textarea id="postContent" placeholder="分享你的校园生活..."></textarea>
          <div class="image-preview" id="imagePreview" style="display:none;">
            <div id="previewImages"></div>
            <button class="remove-img" onclick="removeImage()">&times;</button>
          </div>
          <div class="composer-footer">
            <div class="composer-left">
              <select id="postSection" class="section-select"></select>
              <label class="file-input-label">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg> 图片/视频/文件
                <input type="file" id="imageInput" accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.rar" multiple onchange="previewImages()">
              </label>
              <button class="btn btn-outline btn-sm" onclick="togglePollForm()">📊 投票</button>
            </div>
            <button class="btn btn-primary btn-sm" onclick="createPost()">发布动态</button>
          </div>
          <div class="poll-form" id="pollForm" style="display:none">
            <input type="text" id="pollQuestion" placeholder="投票问题" style="width:100%;margin-bottom:8px">
            <div id="pollOptions">
              <div class="poll-option-row"><input type="text" placeholder="选项 1"><span class="poll-opt-remove" onclick="removePollOption(this)">✕</span></div>
              <div class="poll-option-row"><input type="text" placeholder="选项 2"><span class="poll-opt-remove" onclick="removePollOption(this)">✕</span></div>
            </div>
            <button class="btn btn-outline btn-sm" onclick="addPollOption()">+ 添加选项</button>
          </div>
        </div>
        <div id="postsList"></div>
        <div id="pollsContainer"></div>
        <div id="loadingMore" class="loading-more" style="display:none"><div class="spinner"></div>加载中...</div>
      </main>
      <aside class="right-panel">
        <div class="panel-card"><h3>热门分区</h3><div id="hotSections"></div></div>
        <div class="panel-card">
          <h3>昆山市张浦高级中学</h3>
          <div style="font-size:13px;color:#8c8c8c;line-height:1.8;">
            发布动态分享生活<br>评论互动交朋友<br>点赞支持好内容<br>不同分区看帖子
          </div>
        </div>
      </aside>
    </div>
  </div>

  <div id="searchPage" style="display:none">
    <div class="search-header">
      <button class="btn btn-outline btn-sm" onclick="showMainPage()">&larr; 返回</button>
      <h3>搜索结果</h3>
    </div>
    <div id="searchResults" class="feed"></div>
  </div>

  <div id="chatPage" style="display:none">
    <div class="chat-layout">
      <div class="chat-sidebar">
        <div class="chat-sidebar-header">
          <h3>消息</h3>
          <button class="btn btn-sm btn-outline" onclick="showNewGroup()">+ 建群</button>
        </div>
        <div id="conversationList"></div>
        <div id="groupList"></div>
      </div>
      <div class="chat-main">
        <div id="chatHeader" class="chat-header">
          <span class="chat-back" onclick="closeChat()">&larr; 返回</span>
          <span id="chatTitle">选择对话</span>
        </div>
        <div id="chatMessages" class="chat-messages">
          <div class="empty-state"><div class="empty-icon">💬</div><div class="empty-text">选择一个对话开始聊天</div></div>
        </div>
        <div class="chat-input-area" id="chatInputArea" style="display:none">
          <textarea id="chatInput" placeholder="输入消息..." rows="2" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMessage()}"></textarea>
          <div class="chat-input-actions">
            <label class="file-input-label chat-file-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
              <input type="file" id="chatFileInput" onchange="sendChatFile()">
            </label>
            <button class="btn btn-primary btn-sm" onclick="sendChatMessage()">发送</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 新建群聊弹窗 -->
  <div id="newGroupModal" class="modal" style="display:none">
    <div class="modal-card">
      <h3>创建群聊</h3>
      <div class="form-group"><label>群名称</label><input type="text" id="groupName" placeholder="输入群名称"></div>
      <div class="form-group"><label>邀请成员 (ID, 逗号分隔)</label><input type="text" id="groupMembers" placeholder="输入用户ID"></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary btn-sm" onclick="createGroup()">创建</button>
        <button class="btn btn-outline btn-sm" onclick="closeNewGroup()">取消</button>
      </div>
    </div>
  </div>

  <div id="profilePage" style="display:none">
    <div class="profile-container">
      <button class="btn btn-outline btn-sm back-btn" onclick="showMainPage()">&larr; 返回首页</button>
      <div class="profile-header">
        <div class="profile-avatar-wrap">
          <div class="profile-avatar" id="profileAvatar"></div>
          <img id="profileAvatarImg" class="profile-avatar-img" src="" alt="" style="display:none">
          <div class="avatar-upload" id="avatarUploadBtn" style="display:none">
            <label class="avatar-upload-label" title="更换头像">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              <input type="file" id="avatarInput" accept="image/*" onchange="uploadAvatar()">
            </label>
          </div>
        </div>
        <div class="profile-name" id="profileName"></div>
        <div class="profile-meta">
          <span id="profileSchool"></span>
          <span id="profileGender" class="gender-tag"></span>
          <span id="profileGrade" class="grade-tag"></span>
        </div>
        <div class="profile-bio" id="profileBio"></div>
        <div class="profile-info-row">
          <span id="profileBirthday"></span>
          <span id="profileZodiac" class="zodiac-tag"></span>
        </div>
        <div class="profile-stats">
          <div class="profile-stat"><div class="num" id="profilePostCount">0</div><div class="label">帖子</div></div>
        </div>
        <div id="profileActions" style="margin-top:16px"></div>
        <div class="profile-edit" id="profileEditForm">
          <div class="form-group"><label>昵称</label><input type="text" id="editNickname"></div>
          <div class="form-group"><label>学校</label><input type="text" id="editSchool"></div>
          <div class="form-group"><label>年级/班级</label><input type="text" id="editGrade" placeholder="如：高二(3)班"></div>
          <div class="form-group"><label>性别</label><select id="editGender"><option value="">未设置</option><option value="男">男</option><option value="女">女</option></select></div>
          <div class="form-group"><label>生日</label><input type="date" id="editBirthday"></div>
          <div class="form-group"><label>星座</label><input type="text" id="editZodiac" readonly style="background:#f5f5f5;color:var(--text-secondary)"></div>
          <div class="form-group"><label>个人简介</label><textarea id="editBio"></textarea></div>
          <div class="form-group"><label>个性签名</label><input type="text" id="editSignature" placeholder="一句话介绍自己"></div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-primary btn-sm" onclick="saveProfile()">保存</button>
            <button class="btn btn-outline btn-sm" onclick="toggleEditProfile()">取消</button>
          </div>
        </div>
      </div>
      <div id="profilePosts" class="feed"></div>
    </div>
  </div>

</div>

<script src="/js/app.js"></script>
</body>
</html>
